[package]
name = "jman-java-lsp"
version.workspace = true
edition = "2024"
license = "Apache-2.0"
rust-version.workspace = true

[dependencies]
base64 = "0.22"
dirs = "6"
hex.workspace = true
javac-frontend = { path = "../javac-frontend" }
jman-config = { path = "../jman-config" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
zip = { version = "4", default-features = false, features = ["deflate"] }

[features]
default = []
native-ffi = ["javac-frontend/native-ffi"]

[lib]
path = "src/lib.rs"

[[bin]]
name = "jman-java-lsp"
path = "src/main.rs"

[dev-dependencies]
tempfile = "3.0"
