name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing annotated release tag, for example v0.8.1
        required: true
        type: string

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build-linux:
    name: Build Linux x64 assets
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    permissions:
      contents: read
    env:
      JMAN_RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

    steps:
      - name: Check out release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.JMAN_RELEASE_TAG }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify release tag
        run: |
          test "$(git cat-file -t "${JMAN_RELEASE_TAG}")" = tag
          git tag --points-at HEAD --list "${JMAN_RELEASE_TAG}" | grep -Fx "${JMAN_RELEASE_TAG}"
          ./scripts/verify-release-version.sh "${JMAN_RELEASE_TAG}"

      - name: Set up test JDKs with JMAN
        run: ./scripts/setup-test-jdks.sh --all

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Set up Neovim
        run: |
          archive="${RUNNER_TEMP}/nvim-linux-x86_64.tar.gz"
          install_dir="${RUNNER_TEMP}/neovim-0.11.7"
          curl --fail --location --silent --show-error \
            https://github.com/neovim/neovim/releases/download/v0.11.7/nvim-linux-x86_64.tar.gz \
            --output "${archive}"
          printf '%s  %s\n' \
            38a7c6317f94503841096c00e8fde05ef04b9472fc9d7d62b6e033cecd6f7991 \
            "${archive}" | sha256sum --check -
          mkdir -p "${install_dir}"
          tar -xzf "${archive}" -C "${install_dir}" --strip-components=1
          "${install_dir}/bin/nvim" --version
          echo "${install_dir}/bin" >> "${GITHUB_PATH}"

      - name: Set up Rust
        run: |
          rustup toolchain install 1.97.1 --profile minimal --component rustfmt,clippy
          rustup default 1.97.1

      - name: Install extension dependencies
        run: npm ci --prefix editors/vscode

      - name: Provision pinned compatibility tools
        run: |
          ./scripts/setup-compatibility-tools.sh
          printf '%s\n' "${GITHUB_WORKSPACE}/target/compatibility-tools/apache-maven-3.9.9/bin" >> "${GITHUB_PATH}"
          printf '%s\n' "${GITHUB_WORKSPACE}/target/compatibility-tools/gradle-9.1.0/bin" >> "${GITHUB_PATH}"

      - name: Validate release source
        run: |
          cargo fmt --all -- --check
          make ci
          JMAN_JAVAC_FRONTEND_LIB_DIR=target/native LD_LIBRARY_PATH=target/native \
            cargo clippy --workspace --all-targets --all-features -- -D warnings
          npm audit --prefix editors/vscode --audit-level=high

      - name: Verify full release compatibility
        run: make release-gates

      - name: Build CLI archive
        run: make release

      - name: Build VS Code extension
        run: make package-vscode

      - name: Upload Linux assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: platform-assets-linux-${{ env.JMAN_RELEASE_TAG }}
          path: |
            target/release-dist/*.tar.gz
            target/vscode/*.vsix
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  build-macos:
    name: Build macOS ARM64 assets
    runs-on: macos-15
    timeout-minutes: 120
    permissions:
      contents: read
    env:
      JMAN_RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

    steps:
      - name: Check out release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.JMAN_RELEASE_TAG }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify release tag and host
        run: |
          test "$(uname -s)-$(uname -m)" = Darwin-arm64
          test "$(git cat-file -t "${JMAN_RELEASE_TAG}")" = tag
          git tag --points-at HEAD --list "${JMAN_RELEASE_TAG}" | grep -Fx "${JMAN_RELEASE_TAG}"
          ./scripts/verify-release-version.sh "${JMAN_RELEASE_TAG}"

      # The pre-macOS JMAN bootstrap cannot run on macOS. This seed JDK is used
      # only to build the native frontend; released JMAN manages later JDKs.
      - name: Set up GraalVM 25
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: graalvm
          java-version: "25"

      - name: Select the native-image toolchain
        run: |
          native-image --version
          printf 'JMAN_GRAALVM_HOME=%s\n' "${JAVA_HOME}" >> "${GITHUB_ENV}"

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Set up Rust
        run: |
          rustup toolchain install 1.97.1 --profile minimal --component rustfmt
          rustup default 1.97.1

      - name: Install extension dependencies
        run: npm ci --prefix editors/vscode

      - name: Build and smoke-test macOS packages
        run: |
          cargo fmt --all -- --check
          make test-rust test-installer release package-vscode
          target/release/jman --version

      - name: Upload macOS assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: platform-assets-macos-${{ env.JMAN_RELEASE_TAG }}
          path: |
            target/release-dist/*.tar.gz
            target/vscode/*.vsix
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  stage:
    name: Stage and attest release assets
    needs: [build-linux, build-macos]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    env:
      JMAN_RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

    steps:
      - name: Check out release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.JMAN_RELEASE_TAG }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Download Linux assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: platform-assets-linux-${{ env.JMAN_RELEASE_TAG }}
          path: platform-assets/linux

      - name: Download macOS assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: platform-assets-macos-${{ env.JMAN_RELEASE_TAG }}
          path: platform-assets/macos

      - name: Stage release assets
        run: |
          mkdir -p target/release-dist target/vscode
          find platform-assets -type f -name '*.tar.gz' -exec cp {} target/release-dist/ \;
          find platform-assets -type f -name '*.vsix' -exec cp {} target/vscode/ \;
          make stage-release TAG="${JMAN_RELEASE_TAG}"

      - name: Attest CLI archives
        uses: actions/attest@c32b4b8b198b65d0bd9d63490e847ff7b53989d4 # v4.0.0
        with:
          subject-path: target/github-release/*.tar.gz

      - name: Attest VS Code packages
        uses: actions/attest@c32b4b8b198b65d0bd9d63490e847ff7b53989d4 # v4.0.0
        with:
          subject-path: target/github-release/*.vsix

      - name: Attest installer
        uses: actions/attest@c32b4b8b198b65d0bd9d63490e847ff7b53989d4 # v4.0.0
        with:
          subject-path: target/github-release/install.sh

      - name: Upload release assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-assets-${{ env.JMAN_RELEASE_TAG }}
          path: target/github-release/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  publish:
    name: Publish GitHub Release
    needs: stage
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      JMAN_RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

    steps:
      - name: Download release assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-assets-${{ env.JMAN_RELEASE_TAG }}
          path: release-assets

      - name: Verify release assets
        run: |
          cd release-assets
          sha256sum --check SHA256SUMS
          node -e 'const m=require("./release-manifest.json"); if(m.releaseTag!==process.env.JMAN_RELEASE_TAG) process.exit(1)'

      - name: Create or update GitHub Release
        run: |
          release_flags=(--verify-tag --title "JMAN ${JMAN_RELEASE_TAG#v}" --generate-notes)
          if [[ "${JMAN_RELEASE_TAG#v}" == *-* ]]; then
            release_flags+=(--prerelease)
          fi

          if gh release view "${JMAN_RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release upload "${JMAN_RELEASE_TAG}" release-assets/* \
              --repo "${GITHUB_REPOSITORY}" \
              --clobber
          else
            gh release create "${JMAN_RELEASE_TAG}" release-assets/* \
              --repo "${GITHUB_REPOSITORY}" \
              "${release_flags[@]}"
          fi
