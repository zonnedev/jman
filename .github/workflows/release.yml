name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing annotated release tag, for example v0.1.0-rc.1
        required: true
        type: string

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and attest release assets
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

    steps:
      - name: Check out release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify release tag
        run: |
          test "$(git cat-file -t "${RELEASE_TAG}")" = tag
          git tag --points-at HEAD --list "${RELEASE_TAG}" | grep -Fx "${RELEASE_TAG}"
          ./scripts/verify-release-version.sh "${RELEASE_TAG}"

      - name: Set up GraalVM
        uses: graalvm/setup-graalvm@0426e2e191540e8514dff98dc52a5f5146a2a276 # v1.6.6
        with:
          java-version: "25.0.4"
          distribution: graalvm
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Set up Rust
        run: |
          rustup toolchain install 1.85.0 --profile minimal --component rustfmt,clippy
          rustup default 1.85.0

      - name: Install extension dependencies
        run: npm ci --prefix editors/vscode

      - name: Validate release source
        run: |
          cargo fmt --all -- --check
          make ci
          JAVAC_FRONTEND_LIB_DIR=target/native LD_LIBRARY_PATH=target/native \
            cargo clippy --workspace --all-targets --all-features -- -D warnings
          npm audit --prefix editors/vscode --audit-level=high

      - name: Build CLI archive
        run: make release

      - name: Build VS Code extension
        run: make package-vscode

      - name: Stage release assets
        run: make stage-release TAG="${RELEASE_TAG}"

      - name: Attest CLI archive
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: target/github-release/*.tar.gz

      - name: Attest VS Code package
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: target/github-release/*.vsix

      - name: Upload release assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-assets-${{ env.RELEASE_TAG }}
          path: target/github-release/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

    steps:
      - name: Download release assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-assets-${{ env.RELEASE_TAG }}
          path: release-assets

      - name: Verify release assets
        run: |
          cd release-assets
          sha256sum --check SHA256SUMS
          node -e 'const m=require("./release-manifest.json"); if(m.releaseTag!==process.env.RELEASE_TAG) process.exit(1)'

      - name: Create or update GitHub Release
        run: |
          release_flags=(--verify-tag --title "JMAN ${RELEASE_TAG#v}" --generate-notes)
          if [[ "${RELEASE_TAG#v}" == *-* ]]; then
            release_flags+=(--prerelease)
          fi

          if gh release view "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release upload "${RELEASE_TAG}" release-assets/* \
              --repo "${GITHUB_REPOSITORY}" \
              --clobber
          else
            gh release create "${RELEASE_TAG}" release-assets/* \
              --repo "${GITHUB_REPOSITORY}" \
              "${release_flags[@]}"
          fi
