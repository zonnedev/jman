name: Verify VS Code Marketplace Identity

on:
  workflow_dispatch:

concurrency:
  group: vscode-marketplace-identity
  cancel-in-progress: false

jobs:
  verify:
    name: Resolve Marketplace identity
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: vscode-marketplace
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Sign in to Azure with workload identity federation
        uses: azure/login@532459ea530d8321f2fb9bb10d1e0bcf23869a43 # v3.0.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Resolve Visual Studio Marketplace identity
        shell: bash
        run: |
          set -euo pipefail
          profile_id="$(az rest \
            --url https://app.vssps.visualstudio.com/_apis/profile/profiles/me \
            --resource 499b84ac-1321-427f-aa17-267ca6975798 \
            --query id \
            --output tsv)"
          test -n "${profile_id}"
          {
            printf '## Visual Studio Marketplace identity\n\n'
            printf 'Add this identity to the `zonnedev` publisher as a Contributor:\n\n'
            printf '`%s`\n' "${profile_id}"
          } >> "${GITHUB_STEP_SUMMARY}"
