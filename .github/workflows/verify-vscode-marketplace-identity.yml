name: Verify VS Code Marketplace Identity

on:
  workflow_dispatch:

concurrency:
  group: vscode-marketplace-identity
  cancel-in-progress: false

jobs:
  verify:
    name: Verify Marketplace access
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: vscode-marketplace
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Sign in to Azure with workload identity federation
        uses: azure/login@532459ea530d8321f2fb9bb10d1e0bcf23869a43 # v3.0.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Install pinned publisher CLI
        run: npm ci --prefix editors/vscode

      - name: Verify Marketplace publisher access
        working-directory: editors/vscode
        run: npx vsce verify-pat --azure-credential zonnedev
