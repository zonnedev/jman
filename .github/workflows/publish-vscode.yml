name: Publish VS Code Marketplace

on:
  workflow_dispatch:
    inputs:
      tag:
        description: GitHub Release tag containing the reviewed VSIX
        required: true
        type: string

concurrency:
  group: vscode-marketplace
  cancel-in-progress: false

jobs:
  publish:
    name: Publish reviewed VSIX
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: vscode-marketplace
    permissions:
      contents: read
      id-token: write
    env:
      GH_TOKEN: ${{ github.token }}
      JMAN_RELEASE_TAG: ${{ inputs.tag }}

    steps:
      - name: Sign in to Azure with workload identity federation
        uses: azure/login@532459ea530d8321f2fb9bb10d1e0bcf23869a43 # v3.0.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Check out release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.JMAN_RELEASE_TAG }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Install pinned publisher CLI
        run: npm ci --prefix editors/vscode

      - name: Download reviewed VSIX
        run: |
          mkdir -p marketplace-assets
          gh release download "${JMAN_RELEASE_TAG}" \
            --repo "${GITHUB_REPOSITORY}" \
            --pattern "jman-java-*.vsix" \
            --pattern SHA256SUMS \
            --dir marketplace-assets

      - name: Verify VSIX identity and checksum
        run: |
          mapfile -t packages < <(find marketplace-assets -maxdepth 1 -name 'jman-java-*.vsix' -type f | sort)
          test "${#packages[@]}" -eq 2
          printf '%s\n' "${packages[@]}" | grep -q -- '-darwin-arm64[.]vsix$'
          printf '%s\n' "${packages[@]}" | grep -q -- '-linux-x64[.]vsix$'
          for package in "${packages[@]}"; do
            package_name="$(basename "${package}")"
            (
              cd marketplace-assets
              grep "  ${package_name}$" SHA256SUMS | sha256sum --check -
            )
            unzip -p "${package}" extension/package.json | node -e '
              let data="";
              process.stdin.on("data", chunk => data += chunk);
              process.stdin.on("end", () => {
                const manifest=JSON.parse(data);
                if (manifest.publisher !== "zonnedev" || manifest.name !== "jman-java") process.exit(1);
              });
            '
          done

      - name: Publish to Visual Studio Marketplace
        run: |
          mapfile -t packages < <(find marketplace-assets -maxdepth 1 -name 'jman-java-*.vsix' -type f | sort)
          for package in "${packages[@]}"; do
            publish_args=(
              publish
              --packagePath "${GITHUB_WORKSPACE}/${package}"
              --azure-credential
              --skip-duplicate
            )
            if [[ "${JMAN_RELEASE_TAG#v}" == *-* ]]; then
              publish_args+=(--pre-release)
            fi
            editors/vscode/node_modules/.bin/vsce "${publish_args[@]}"
          done
