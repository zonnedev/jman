name: CI

on:
  pull_request:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify Linux x64
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Lint GitHub Actions workflows
        run: |
          actionlint_dir=""
          cleanup() {
            if [[ -n "${actionlint_dir}" ]]; then
              rm -rf -- "${actionlint_dir}"
            fi
          }
          trap cleanup EXIT
          actionlint_dir="$(mktemp -d)"
          curl --fail --location --silent --show-error \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz \
            --output "${actionlint_dir}/actionlint.tar.gz"
          printf '%s  %s\n' \
            8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8 \
            "${actionlint_dir}/actionlint.tar.gz" | sha256sum --check -
          tar -xzf "${actionlint_dir}/actionlint.tar.gz" -C "${actionlint_dir}"
          "${actionlint_dir}/actionlint"

      - name: Set up test GraalVM with JMAN
        run: ./scripts/setup-test-jdks.sh --graalvm

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Set up Neovim
        run: |
          archive="${RUNNER_TEMP}/nvim-linux-x86_64.tar.gz"
          install_dir="${RUNNER_TEMP}/neovim-0.11.7"
          curl --fail --location --silent --show-error \
            https://github.com/neovim/neovim/releases/download/v0.11.7/nvim-linux-x86_64.tar.gz \
            --output "${archive}"
          printf '%s  %s\n' \
            38a7c6317f94503841096c00e8fde05ef04b9472fc9d7d62b6e033cecd6f7991 \
            "${archive}" | sha256sum --check -
          mkdir -p "${install_dir}"
          tar -xzf "${archive}" -C "${install_dir}" --strip-components=1
          "${install_dir}/bin/nvim" --version
          echo "${install_dir}/bin" >> "${GITHUB_PATH}"

      - name: Set up Rust
        run: |
          rustup toolchain install 1.97.1 --profile minimal --component rustfmt,clippy
          rustup default 1.97.1

      - name: Install extension dependencies
        run: npm ci --prefix editors/vscode

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run portable test suite
        run: make ci

      - name: Lint Rust workspace
        env:
          JMAN_JAVAC_FRONTEND_LIB_DIR: target/native
          LD_LIBRARY_PATH: target/native
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Audit extension dependencies
        run: npm audit --prefix editors/vscode --audit-level=high

  verify-macos:
    name: Verify macOS ARM64
    runs-on: macos-15
    timeout-minutes: 120

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify host
        run: test "$(uname -s)-$(uname -m)" = Darwin-arm64

      # The checksum-pinned bootstrap release predates macOS support. Use one
      # pinned seed JDK to build JMAN; JMAN remains the project-JDK manager.
      - name: Set up GraalVM 25
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: graalvm
          java-version: "25"

      - name: Select the native-image toolchain
        run: |
          native-image --version
          printf 'JMAN_GRAALVM_HOME=%s\n' "${JAVA_HOME}" >> "${GITHUB_ENV}"

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Set up Rust
        run: |
          rustup toolchain install 1.97.1 --profile minimal --component rustfmt
          rustup default 1.97.1

      - name: Install extension dependencies
        run: npm ci --prefix editors/vscode

      - name: Verify macOS build and packages
        run: |
          cargo fmt --all -- --check
          make test-rust test-installer release package-vscode
          target/release/jman --version
