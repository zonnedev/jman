syntax = "proto3";

package jman.example.library.v1;

option java_package = "dev.zonnedev.jman.example.contract.grpc";
option java_outer_classname = "LibraryProto";

service LibraryService {
  rpc CreateUser(CreateUserRequest) returns (UserResponse);
  rpc GetUser(GetUserRequest) returns (UserResponse);
  rpc ListUsers(ListUsersRequest) returns (ListUsersResponse);
  rpc RegisterBook(RegisterBookRequest) returns (BookResponse);
  rpc ListBooks(ListBooksRequest) returns (ListBooksResponse);
  rpc TransferBook(TransferBookRequest) returns (BookResponse);
}

message CreateUserRequest { string name = 1; }
message GetUserRequest { string user_id = 1; }
message ListUsersRequest {}
message RegisterBookRequest {
  string owner_id = 1;
  string title = 2;
}
message ListBooksRequest { string owner_id = 1; }
message TransferBookRequest {
  string book_id = 1;
  string new_owner_id = 2;
}
message UserResponse {
  string id = 1;
  string name = 2;
  repeated string book_ids = 3;
}
message ListUsersResponse { repeated UserResponse users = 1; }
message BookResponse {
  string id = 1;
  string title = 2;
  string owner_id = 3;
}
message ListBooksResponse { repeated BookResponse books = 1; }

