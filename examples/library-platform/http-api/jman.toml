manifest-version = 1

[project]
group = "dev.zonnedev.jman.example"
name = "library-http-api"
version = "1.0.0"
java-release = 25
packaging = "jar"
main-class = "dev.zonnedev.jman.example.http.HttpApplication"

[dependencies.compile]
"dev.zonnedev.jman.example:library-api-contracts" = { path = "../api-contracts" }
"dev.zonnedev.jman.example:library-application" = { path = "../application" }
"dev.zonnedev.jman.example:library-domain" = { path = "../domain" }
"io.micronaut:micronaut-http-server-netty" = "4.10.29"
"io.micronaut:micronaut-jackson-databind" = "4.10.29"
"io.micronaut:micronaut-runtime" = "4.10.29"
"jakarta.annotation:jakarta.annotation-api" = "3.0.0"
"jakarta.inject:jakarta.inject-api" = "2.0.1"

[dependencies.runtime]
"org.yaml:snakeyaml" = "2.5"

[dependencies.test]
"io.micronaut:micronaut-http-client" = "4.10.29"
"org.junit.platform:junit-platform-console-standalone" = "1.12.2"

[annotation-processors]
"io.micronaut:micronaut-inject-java" = "4.10.29"
